<!DOCTYPE html>
<html lang="vi">
<head><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tăng San Bốc Dịch AI</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        header { background: #1e293b; padding: 12px 16px; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
        header h1 { margin: 0; font-size: 17px; color: #fbbf24; }
        #clear-btn { background: #334155; color: #cbd5e1; border: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; }
        #chat-box { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 14px; }
        .msg { max-width: 95%; padding: 12px 14px; border-radius: 12px; line-height: 1.6; font-size: 15px; }
        .user { align-self: flex-end; background: #0284c7; color: #fff; }
        .bot { align-self: flex-start; background: #1e293b; border: 1px solid #334155; width: 100%; box-sizing: border-box; }
        pre { background: #020617; color: #4ade80; padding: 10px; border-radius: 8px; overflow-x: auto; font-size: 11px; line-height: 1.45; border: 1px solid #1e293b; }
        .copy-btn { margin-top: 10px; background: #334155; color: #fbbf24; border: 1px solid #475569; padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; }
        form { display: flex; padding: 10px; background: #1e293b; border-top: 1px solid #334155; gap: 8px; }
        input { flex: 1; padding: 11px 14px; border-radius: 20px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 15px; outline: none; }
        button[type="submit"] { background: #f59e0b; color: #0f172a; border: none; padding: 0 18px; border-radius: 20px; font-weight: bold; font-size: 15px; cursor: pointer; }
    </style>
</head>
<body>
    <header>
        <h1>☯ Tăng San Bốc Dịch AI</h1>
        <button id="clear-btn" onclick="xoaLichSu()">Xóa lịch sử</button>
    </header>
    <div id="chat-box"></div>
    <form id="chat-form">
        <input type="text" id="cau-hoi" placeholder="Nhập việc cần hỏi quẻ..." required autocomplete="off">
        <button type="submit">Gieo Quẻ</button>
    </form>
    <script>
        const chatBox = document.getElementById('chat-box');
        function taiLichSu() {
            const saved = localStorage.getItem('lich_su_boc_dich');
            chatBox.innerHTML = saved || '<div class="msg bot">Chào bạn, hãy tĩnh tâm nhập việc cần hỏi để hệ thống khởi quẻ theo thời gian thực.</div>';
            chatBox.scrollTop = chatBox.scrollHeight;
        }
        function luuLichSu() { localStorage.setItem('lich_su_boc_dich', chatBox.innerHTML); }
        function xoaLichSu() { localStorage.removeItem('lich_su_boc_dich'); taiLichSu(); }
        function saoChepQue(btn) {
            const text = btn.parentElement.innerText.replace('📋 Sao chép kết quả', '').trim();
            navigator.clipboard.writeText(text);
            btn.innerText = '✅ Đã sao chép!';
            setTimeout(() => btn.innerText = '📋 Sao chép kết quả', 2000);
        }
        taiLichSu();

        document.getElementById('chat-form').onsubmit = async (e) => {
            e.preventDefault();
            const inp = document.getElementById('cau-hoi');
            const text = inp.value.trim();
            if (!text) return;
            chatBox.innerHTML += `<div class="msg user">${text}</div>`;
            inp.value = '';
            const loadingId = 'load-' + Date.now();
            chatBox.innerHTML += `<div class="msg bot" id="${loadingId}">⏳ Đang khởi quẻ và luận giải...</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const res = await fetch('/ask', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({question: text})
                });
                const data = await res.json();
                const el = document.getElementById(loadingId);
                const luanGiai = (data.luan_giai || '').replace(/\*\*(.*?)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>');
                const copyHtml = data.bang_que ? '<br><button class="copy-btn" onclick="saoChepQue(this)">📋 Sao chép kết quả</button>' : '';
                el.innerHTML = (data.bang_que ? `<pre>${data.bang_que}</pre>` : '') + `<div>${luanGiai}</div>` + copyHtml;
            } catch (err) {
                document.getElementById(loadingId).innerHTML = '⚠️ Kết nối gián đoạn, vui lòng thử lại.';
            }
            luuLichSu();
            chatBox.scrollTop = chatBox.scrollHeight;
        };
    </script>
</body>
</html>
