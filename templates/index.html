<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tăng San Bốc Dịch AI</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #131314; color: #e3e3e3; display: flex; flex-direction: column; height: 100dvh; }
        header { background: #1e1f20; padding: 14px; text-align: center; border-bottom: 1px solid #333537; font-weight: bold; color: #f0d082; }
        #chat-box { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 14px; }
        .msg { max-width: 94%; padding: 12px 15px; border-radius: 16px; line-height: 1.5; font-size: 15px; }
        .user-msg { background: #2b2c2f; color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
        .ai-msg { background: #1e1f20; align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid #2e3033; width: 100%; }
        .que-card { background: #0d0e0f; color: #7ee787; font-family: monospace; font-size: 11px; padding: 10px; border-radius: 8px; overflow-x: auto; white-space: pre; margin-bottom: 10px; border: 1px solid #26292e; }
        .luan-text { white-space: pre-wrap; }
        .luan-text strong { color: #f0d082; }
        #input-area { background: #1e1f20; padding: 10px; display: flex; gap: 8px; border-top: 1px solid #333537; }
        #user-input { flex: 1; background: #2b2c2f; color: #fff; border: none; padding: 12px 16px; border-radius: 24px; font-size: 15px; outline: none; }
        #send-btn { background: #f0d082; color: #131314; border: none; width: 42px; height: 42px; border-radius: 50%; font-weight: bold; font-size: 18px; }
    </style>
</head>
<body>
    <header>☯️ Tăng San Bốc Dịch AI</header>
    <div id="chat-box">
        <div class="msg ai-msg"><div class="luan-text">Chào bạn. Hãy tĩnh tâm và nhập điều bạn đang mong cầu vào ô bên dưới. Hệ thống sẽ tự lấy ngày giờ, tiết khí hiện tại để lập quẻ.</div></div>
    </div>
    <div id="input-area">
        <input type="text" id="user-input" placeholder="Nhập điều bạn đang mong cầu..." autocomplete="off">
        <button id="send-btn">➤</button>
    </div>
    <script>
        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');

        function formatBold(t) { return t.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\*(.*?)\*/g, '<em>$1</em>'); }

        async function typeWriter(el, text) {
            let cur = "";
            for (let w of text.split(" ")) {
                cur += w + " ";
                el.innerHTML = formatBold(cur);
                chatBox.scrollTop = chatBox.scrollHeight;
                await new Promise(r => setTimeout(r, 25));
            }
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;
            userInput.value = ''; userInput.disabled = true; sendBtn.disabled = true;

            const uDiv = document.createElement('div');
            uDiv.className = 'msg user-msg'; uDiv.textContent = text;
            chatBox.appendChild(uDiv);

            const aiDiv = document.createElement('div');
            aiDiv.className = 'msg ai-msg'; aiDiv.innerHTML = '<div class="luan-text">⏳ Đang khởi quẻ...</div>';
            chatBox.appendChild(aiDiv); chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const res = await fetch('/ask', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question: text })
                });
                const data = await res.json();
                aiDiv.innerHTML = (data.bang_que ? `<div class="que-card">${data.bang_que}</div>` : '') + `<div class="luan-text"></div>`;
                await typeWriter(aiDiv.querySelector('.luan-text'), data.luan_giai);
            } catch (e) { aiDiv.innerHTML = '<div class="luan-text">❌ Lỗi kết nối.</div>'; }

            userInput.disabled = false; sendBtn.disabled = false; userInput.focus();
        }
        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });
    </script>
</body>
</html>
